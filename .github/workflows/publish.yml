name: Publish C# SDK

# Packages go to GitHub Packages (nuget.pkg.github.com/Damix48). Consumers need
# a nuget.config entry for that feed, since it is not a public source.
#
# The engine's own tests (make test) and the SDK's golden-vector tests need
# models/*.bin, which come from the HuggingFace checkpoint (`make pack`) and are
# far too large for the repo. CI covers instead: the shared library builds, the
# binding loads it and the ABI version matches, the projects compile, and the
# nupkg contains a native asset for every RID that was built. Numeric parity is
# checked locally with `make golden && dotnet test`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (default: tag without v, else 0.1.0-ci.<run>)"
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    uses: ./.github/workflows/build-native.yml
    with:
      os: ubuntu-latest
      rid: linux-x64

  macos:
    # macOS runners are not available to every repository (private repos on the
    # free plan get "The configuration 'macos-14-arm64-us-default' is not
    # supported"). Set the repository variable E2_MACOS_RUNNER — e.g. macos-14 —
    # once the account has them, and this leg joins the package.
    if: vars.E2_MACOS_RUNNER != ''
    uses: ./.github/workflows/build-native.yml
    with:
      os: ${{ vars.E2_MACOS_RUNNER }}
      rid: osx-arm64

  publish:
    name: pack and push
    needs: [linux, macos]
    # Publish whenever the linux leg worked, even if macos was skipped or failed.
    if: always() && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # required to push to GitHub Packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          # Authenticates dotnet against GitHub Packages for the push below.
          source-url: https://nuget.pkg.github.com/damix48/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: /tmp/native

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "packaging $version"

      - name: Pack
        # The csproj globs runtimes/**; drop every RID in place first.
        run: |
          mkdir -p sdk/csharp/src/E2/runtimes
          cp -r /tmp/native/* sdk/csharp/src/E2/runtimes/
          dotnet pack sdk/csharp/src/E2/E2.csproj -c Release \
            -p:Version=${{ steps.version.outputs.version }} -o dist

      - name: Verify the package carries every native library
        run: |
          set -e
          [ -f sdk/csharp/src/E2/runtimes/linux-x64/native/libe2.so ] || { echo "linux-x64 missing"; exit 1; }
          for lib in sdk/csharp/src/E2/runtimes/*/native/*; do
            [ -s "$lib" ] || { echo "empty $lib"; exit 1; }
          done
          echo "RIDs packaged: $(ls sdk/csharp/src/E2/runtimes | tr '\n' ' ')"
          unzip -l dist/*.nupkg

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "dist/*.nupkg" \
            --source https://nuget.pkg.github.com/damix48/index.json \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate --no-symbols
